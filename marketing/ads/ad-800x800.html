<!doctype html>
<!-- Creatividad para anuncios, 800x800. Se exporta a PNG con Chrome headless (ver README de esta carpeta). -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Anuncio 800x800</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 800px; background: #000; overflow: hidden; }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }

  .ad { position: relative; width: 800px; height: 800px; overflow: hidden;
    background:
      radial-gradient(520px 420px at 78% 78%, rgba(255,106,26,0.45), transparent 70%),
      radial-gradient(380px 300px at 10% 105%, rgba(255,179,107,0.18), transparent 70%),
      #000; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse at 60% 60%, #000 20%, transparent 75%); }

  .brand { position: absolute; top: 48px; left: 56px; display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .brand img { width: 42px; height: 42px; }

  h1 { position: absolute; top: 122px; left: 56px; width: 700px; font-size: 58px; line-height: 1.04; font-weight: 700; letter-spacing: -0.035em; }
  h1 .accent { background: linear-gradient(90deg, #FFB36B, #FF6A1A 55%, #FF3B1F); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* iPhone inclinado, cortado por abajo */
  .phone { position: absolute; left: 468px; top: 300px; width: 278px; height: 602px; padding: 9px; border-radius: 50px;
    background: linear-gradient(180deg, #3a3a3c, #1c1c1e 45%, #2c2c2e);
    box-shadow: 0 40px 90px -20px rgba(0,0,0,0.95), 0 0 80px -10px rgba(255,106,26,0.45), inset 0 0 0 1.5px rgba(255,255,255,0.14);
    transform: rotate(-8deg); }
  .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #fff; }
  .phone .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .phone .island { position: absolute; top: 12px; left: 50%; width: 88px; height: 26px; transform: translateX(-50%); border-radius: 99px; background: #000; }

  /* piezas de iOS en cristal */
  .chip { position: absolute; border-radius: 22px; background: rgba(40,40,44,0.72); border: 1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 24px 50px -16px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.16); }
  .notif { left: 250px; top: 318px; width: 300px; padding: 14px; display: flex; gap: 12px; }
  .notif .icon { flex: none; width: 42px; height: 42px; border-radius: 11px; background: linear-gradient(#1AA8FF, #0A63F5); display: grid; place-items: center; }
  .notif .head { display: flex; justify-content: space-between; font-size: 12px; color: #c7c7cc; }
  .notif .head b { font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; }
  .notif p { font-size: 15px; font-weight: 600; line-height: 1.3; margin-top: 3px; }

  .pay { left: 272px; top: 508px; width: 250px; padding: 15px; }
  .pay .row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #e5e5ea; }
  .pay .btn { margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 13px; background: #fff; color: #000; font-size: 15px; font-weight: 600; padding: 10px; }

  /* oferta */
  .offer { position: absolute; left: 56px; bottom: 56px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 99px; font-size: 22px; font-weight: 700;
    background: linear-gradient(#FF8A3D, #EE4F0C); box-shadow: 0 14px 34px -12px rgba(255,106,26,0.9), inset 0 1px 0 rgba(255,255,255,0.35); }
  .pill small { font-size: 16px; font-weight: 600; opacity: 0.85; }
  .trust { margin-top: 18px; display: grid; gap: 8px; font-size: 16px; color: #e5e5ea; font-weight: 500; }
  .trust span::before { content: "✓"; color: #FF6A1A; font-weight: 800; margin-right: 8px; }
</style>
</head>
<body>
  <div class="ad">
    <div class="grid"></div>

    <div class="brand"><img src="logo-mark.svg" alt="">Swiftcraft</div>
    <h1>Tu app para iPhone,<br><span class="accent">de la idea a la App&nbsp;Store.</span></h1>

    <div class="phone"><div class="screen"><img src="screen-tipson-audit.jpg" alt=""><div class="island"></div></div></div>

    <div class="chip notif">
      <div class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <div>
        <div class="head"><b>App Store Connect</b><span>ahora</span></div>
        <p>Tu app está lista para distribución.</p>
      </div>
    </div>

    <div class="chip pay">
      <div class="row"><span>Suscripción Pro</span><span>9,99 €/mes</span></div>
      <div class="btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9.5v1M15 9.5v1M12 9.5v3.5h-1M9.5 15.5c1.4 1 3.6 1 5 0"/></svg>
        Confirmar con Face ID
      </div>
    </div>

    <div class="offer">
      <div class="pill">MVP desde 7.900 € <small>+ IVA</small></div>
      <div class="trust">
        <span>Presupuesto cerrado</span>
        <span>Código a tu nombre</span>
      </div>
    </div>
  </div>
</body>
</html>
